// Memory Guard — warns when a tab's content process uses too much memory. (First line must stay a comment.)
//
// Settings (about:config, integer prefs, optional):
//   memoryguard.thresholdMB     warning threshold per page process (default 1024)
//   memoryguard.pollSeconds     how often memory is checked (default 5)
//   memoryguard.snoozeMinutes   how long "Ignore" silences a tab (default 10)
//   memoryguard.debug (bool)    print each check to the terminal / browser console
try {
  (() => {
    const { setInterval } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");

    const MB = 1024 * 1024;
    const TAB_BAR = "memory-guard-tab";
    const WINDOW_BAR = "memory-guard-window";
    const settings = () => ({
      thresholdMB: Services.prefs.getIntPref("memoryguard.thresholdMB", 1024),
      pollSeconds: Services.prefs.getIntPref("memoryguard.pollSeconds", 5),
      snoozeMinutes: Services.prefs.getIntPref("memoryguard.snoozeMinutes", 10),
      debug: Services.prefs.getBoolPref("memoryguard.debug", false),
    });

    const snoozedUntil = new WeakMap(); // tab -> timestamp
    const tabsWithBar = new Set(); // tabs currently showing a per-tab warning
    let checking = false;

    const formatGB = bytes => `${(bytes / 1024 ** 3).toFixed(1)} GB`;
    const tabTitle = tab => tab.label || tab.linkedBrowser?.currentURI?.spec || "Untitled";
    const isSnoozed = tab => (snoozedUntil.get(tab) || 0) > Date.now();
    const winOf = tab => tab.documentGlobal ?? tab.ownerGlobal; // renamed in recent Firefox
    const report = message => {
      Services.console.logStringMessage(`[Memory Guard] ${message}`);
      dump(`[Memory Guard] ${message}\n`);
    };
    const log = (...args) => settings().debug && report(args.join(" "));

    function osPidOf(windowGlobal) {
      try {
        return windowGlobal?.osPid ?? windowGlobal?.domProcess?.osPid ?? null;
      } catch (e) {
        return null;
      }
    }

    function snooze(tabs) {
      const until = Date.now() + settings().snoozeMinutes * 60 * 1000;
      for (const tab of tabs) snoozedUntil.set(tab, until);
      check();
    }

    async function unload(tab) {
      const win = winOf(tab);
      const { gBrowser } = win;
      if (tab.closing || !tab.linkedPanel) return;
      // The selected tab cannot be discarded: move to a neighbour (or a new blank tab) first.
      if (tab.selected) {
        const others = gBrowser.visibleTabs.filter(t => t !== tab && !t.closing);
        const index = gBrowser.visibleTabs.indexOf(tab);
        gBrowser.selectedTab =
          others[Math.min(index, others.length - 1)] ||
          gBrowser.addTrustedTab("about:blank");
        if (tab.selected) {
          await new Promise(resolve => {
            const timeout = win.setTimeout(resolve, 1000);
            gBrowser.tabContainer.addEventListener("TabSelect", () => (win.clearTimeout(timeout), resolve()), { once: true });
          });
        }
        if (tab.selected) {
          // Firefox refuses to switch tabs while a window-modal dialog is open.
          report("could not switch away from the tab to unload it (is a dialog open?)");
          check();
          return;
        }
      }
      await gBrowser.prepareDiscardBrowser?.(tab);
      gBrowser.discardBrowser(tab);
      tabsWithBar.delete(tab);
      check();
    }

    async function setBar(box, value, label, buttons) {
      const existing = box.getNotificationWithValue(value);
      if (!label) {
        if (existing) box.removeNotification(existing);
        return;
      }
      // The bar's label can be set but not read back, so remember what was shown.
      if (existing) {
        if (existing._memoryGuardLabel !== label) {
          existing.label = label;
          existing._memoryGuardLabel = label;
        }
        return;
      }
      const bar = await box.appendNotification(
        value,
        { label, priority: box.PRIORITY_WARNING_HIGH },
        buttons,
        false,
        false // not closable with ×: use "Ignore" so the snooze is recorded
      );
      bar._memoryGuardLabel = label;
    }

    function updateTabBar(tab, entry) {
      const { gBrowser } = winOf(tab);
      if (!entry) {
        if (tabsWithBar.delete(tab) && tab.linkedBrowser) {
          setBar(gBrowser.getNotificationBox(tab.linkedBrowser), TAB_BAR, null);
        }
        return;
      }
      tabsWithBar.add(tab);
      const shared = entry.sharedBy > 1 ? ` (its process is shared with ${entry.sharedBy - 1} other tab(s))` : "";
      const label =
        `⚠ This page is using ${formatGB(entry.memory)} of memory${shared}, ` +
        `above the ${formatGB(settings().thresholdMB * MB)} limit. Stop it before Firefox runs out of memory?`;
      setBar(gBrowser.getNotificationBox(tab.linkedBrowser), TAB_BAR, label, [
        { label: "Unload page", callback: () => void unload(tab) },
        { label: "Close tab", callback: () => void gBrowser.removeTab(tab) },
        { label: `Ignore for ${settings().snoozeMinutes} min`, callback: () => void snooze([tab]) },
      ]);
    }

    // A window-level bar lists heavy tabs that are in the background, so they are not missed.
    function updateWindowBar(win, entries) {
      const box = win.gNotificationBox;
      if (!box) return;
      if (!entries.length) {
        setBar(box, WINDOW_BAR, null);
        return;
      }
      const list = entries.map(e => `“${tabTitle(e.tab)}” (${formatGB(e.memory)})`).join(", ");
      const label = `⚠ Background tab${entries.length > 1 ? "s" : ""} using too much memory: ${list}`;
      const tabs = entries.map(e => e.tab);
      // Buttons capture the tab list at creation; recreate the bar when the list changes.
      const existing = box.getNotificationWithValue(WINDOW_BAR);
      if (existing && existing._memoryGuardKey !== tabs.map(t => t.linkedPanel).join()) {
        box.removeNotification(existing, true);
      }
      setBar(box, WINDOW_BAR, label, [
        { label: entries.length > 1 ? "Unload them" : "Unload it", callback: () => void tabs.forEach(unload) },
        { label: "Show", callback: () => void (win.gBrowser.selectedTab = tabs[0]) },
        { label: `Ignore for ${settings().snoozeMinutes} min`, callback: () => void snooze(tabs) },
      ]).then(() => {
        const bar = box.getNotificationWithValue(WINDOW_BAR);
        if (bar) bar._memoryGuardKey = tabs.map(t => t.linkedPanel).join();
      });
    }

    async function check() {
      if (checking) return;
      checking = true;
      try {
        const limit = settings().thresholdMB * MB;
        const info = await ChromeUtils.requestProcInfo();
        const memByPid = new Map(info.children.map(c => [c.pid, c.memory]));

        // Every live tab, with the content processes of its frames.
        const entries = [];
        const tabCountByPid = new Map();
        const windows = [...Services.wm.getEnumerator("navigator:browser")].filter(w => w.gBrowser);
        for (const win of windows) {
          for (const tab of win.gBrowser.tabs) {
            const bc = tab.linkedPanel && tab.linkedBrowser?.browsingContext;
            if (!bc) continue; // discarded / not yet loaded
            const pids = new Set();
            for (const sub of bc.getAllBrowsingContextsInSubtree()) {
              const pid = osPidOf(sub.currentWindowGlobal);
              if (pid && memByPid.has(pid)) pids.add(pid);
            }
            if (!pids.size) continue;
            pids.forEach(pid => tabCountByPid.set(pid, (tabCountByPid.get(pid) || 0) + 1));
            entries.push({ win, tab, pids: [...pids] });
          }
        }

        const heavyByWindow = new Map(windows.map(w => [w, []]));
        const stillHeavy = new Set();
        for (const entry of entries) {
          const pid = entry.pids.reduce((a, b) => (memByPid.get(b) > memByPid.get(a) ? b : a));
          entry.memory = memByPid.get(pid);
          entry.sharedBy = tabCountByPid.get(pid);
          if (entry.memory < limit || isSnoozed(entry.tab)) continue;
          stillHeavy.add(entry.tab);
          updateTabBar(entry.tab, entry);
          if (!entry.tab.selected) heavyByWindow.get(entry.win).push(entry);
        }
        for (const tab of [...tabsWithBar]) {
          if (!stillHeavy.has(tab)) updateTabBar(tab, null);
        }
        for (const [win, heavy] of heavyByWindow) updateWindowBar(win, heavy);

        log(
          `total ${formatGB(info.memory + info.children.reduce((s, c) => s + c.memory, 0))};`,
          entries.map(e => `${formatGB(e.memory)} ${tabTitle(e.tab)}`).join(" | "),
          `| tab bars: ${tabsWithBar.size}, window bars: ${windows.filter(w => w.gNotificationBox?.getNotificationWithValue(WINDOW_BAR)).length}`
        );
      } catch (e) {
        report(`error: ${e}\n${e.stack}`);
      } finally {
        checking = false;
      }
    }

    let started = false;
    Services.obs.addObserver(win => {
      // Re-check right away when the user switches tabs, so bars follow the selection.
      win.gBrowser?.tabContainer.addEventListener("TabSelect", () => check());
      if (!started) {
        started = true;
        setInterval(check, settings().pollSeconds * 1000);
        check();
      }
    }, "browser-delayed-startup-finished");
  })();
} catch (e) {
  Services.console.logStringMessage(`[Memory Guard] failed to start: ${e}`);
}
