<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unloaded page</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 90vh; margin: 0 16px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 4px; overflow-wrap: anywhere; }
    p { opacity: .75; overflow-wrap: anywhere; }
    button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 0; background: #0060df; color: #fff; cursor: pointer; }
  </style>
  <script src="unloaded.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="info"></p>
    <button id="reload">Reload page</button>
  </main>
</body>
</html>
