<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.4 system-ui, -apple-system, sans-serif; width: 380px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    input { width: 70px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 4px 2px; border-top: 1px solid rgba(128,128,128,.25); }
    td.t { max-width: 270px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.m { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .heavy { color: #e5484d; font-weight: 600; }
    .muted { opacity: .7; }
    .error { color: #e5484d; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Memory Guard</h1>
  <label>Warn above <input id="threshold" type="number" min="100" step="100"> MB per page process</label>
  <div id="summary" class="muted"></div>
  <table id="tabs"></table>
</body>
</html>
